<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <title>HACKER EL-NAGM | GEOLOCATION & DATA</title>
    
    <style>
        :root { --green: #00ff41; --red: #ff0000; }
        body, html { margin: 0; background: #000; color: var(--green); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }

        /* تصميم الشبكة الرئيسية */
        .container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 60px 1fr 180px;
            height: 100vh;
            gap: 8px;
            padding: 8px;
            box-sizing: border-box;
        }

        .panel { border: 1px solid var(--green); background: rgba(0, 15, 0, 0.9); padding: 10px; position: relative; box-shadow: inset 0 0 15px rgba(0,255,65,0.2); }

        .header { grid-column: 1 / 4; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--green); }

        /* الخريطة */
        #map-container {
            width: 100%; height: 100%; position: relative;
            background: #010; overflow: hidden;
        }
        iframe {
            width: 100%; height: 100%; border: none; filter: invert(90%) hue-rotate(100deg) brightness(0.5) contrast(1.2);
            pointer-events: none; /* لمنع التفاعل اليدوي وجعله يبدو آلياً */
        }

        /* تدفق البيانات */
        .data-flow { font-size: 11px; color: var(--green); height: 100%; overflow: hidden; }
        .critical { color: var(--red); font-weight: bold; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* واجهة الهاتف */
        #phone-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('ha.jpg') no-repeat center center;
            background-size: cover; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center;
        }

        input { background: #000; border: 1px solid var(--green); color: var(--green); padding: 10px; width: 80%; font-size: 16px; margin: 10px 0; }
        button { background: var(--green); color: #000; font-weight: bold; padding: 12px 25px; border: none; cursor: pointer; width: 100%; }

        .scan-line {
            width: 100%; height: 2px; background: rgba(0, 255, 65, 0.3);
            position: absolute; top: 0; left: 0; animation: scan 4s linear infinite; z-index: 5;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body>

<div class="container" id="hacker-ui">
    <div class="panel header">
        <div style="display:flex; align-items:center; gap:12px;">
            <img src="logo.jpg" style="width:45px; height:45px; border-radius:50%;">
            <h2 style="margin:0; letter-spacing:2px;">EL-NAGM SATELLITE TRACKER</h2>
        </div>
        <div id="status" class="critical">SYSTEM: SCANNING INTERNET...</div>
    </div>

    <div class="panel">
        <h4 style="border-bottom:1px solid var(--green);">ACTIVE_TARGETS</h4>
        <div id="target-list" class="data-flow"></div>
    </div>

    <div class="panel" style="padding:0; overflow:hidden;">
        <div class="scan-line"></div>
        <div id="map-container">
            <iframe id="google-map" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d110502.6038558384!2d31.2357!3d30.0444!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sar!2seg!4v1700000000000!5m2!1sar!2seg"></iframe>
        </div>
    </div>

    <div class="panel">
        <h4 style="border-bottom:1px solid var(--green);">INTELLIGENCE_LAKE</h4>
        <div id="intel-flow" class="data-flow"></div>
    </div>

    <div class="panel" style="grid-column: 1 / 4;">
        <div style="display:flex; gap:20px; align-items:center;">
            <input type="text" id="target-num" placeholder="أدخل رقم الهاتف للتعقب..." style="flex:1;">
            <button onclick="startSatelliteTracking()" style="width:200px;">إطلاق القمر الصناعي</button>
        </div>
        <div id="terminal-out" style="font-size:10px; margin-top:5px; height:80px; overflow:hidden;"></div>
    </div>
</div>

<div id="phone-overlay">
    <div style="width:320px; background:rgba(0,0,0,0.9); border:2px solid var(--green); padding:30px; border-radius:25px; text-align:center;">
        <img src="logo.jpg" style="width:70px; border-radius:50%; margin-bottom:15px;">
        <h2 style="color:white;">TARGET SECURED</h2>
        <p style="font-size:14px;">تم تحديد إحداثيات الموقع بدقة 99.9%</p>
        <p style="color:var(--red);">الجهاز الآن تحت سيطرة "هكر النجم"</p>
        <input type="password" id="phone-pass" placeholder="كود فك التشفير (2009)" maxlength="4" style="text-align:center; font-size:20px;">
        <button onclick="unlockPhone()">دخول للقاعدة</button>
    </div>
</div>

<script>
    // 1. توليد بيانات عشوائية مستمرة
    function generateData() {
        const targetList = document.getElementById('target-list');
        const intelFlow = document.getElementById('intel-flow');
        const terminals = document.getElementById('terminal-out');

        const targets = ["+201023****", "+201154****", "IP: 197.45.2.1", "USA_PROXY_7", "USER_7841"];
        const intel = ["PASS_FOUND", "GPS_SYNC", "WHATSAPP_DUMP", "CALL_RECORD_EXTRACTED"];

        setInterval(() => {
            targetList.innerHTML = `> SCANNING: ${targets[Math.floor(Math.random()*targets.length)]}<br>` + targetList.innerHTML.substring(0, 300);
            intelFlow.innerHTML = `[✓] ${intel[Math.floor(Math.random()*intel.length)]} -> ${Math.random().toString(36).substr(2,5)}<br>` + intelFlow.innerHTML.substring(0, 300);
            terminals.innerHTML += `root@elnagm:~# executing_payload_0x${Math.random().toString(16).substr(2,4)}... `;
            if(terminals.innerHTML.length > 1000) terminals.innerHTML = "";
        }, 1000);
    }
    generateData();

    // 2. وظيفة التعقب بالقمر الصناعي
    function startSatelliteTracking() {
        const num = document.getElementById('target-num').value;
        if(!num) return alert("يرجى إدخال رقم الهدف!");

        document.getElementById('status').innerText = "TRACKING SATELLITE: GPS_TARGET_" + num;
        
        // محاكاة تحريك الخريطة لمواقع عشوائية (تغيير الـ src لخريطة عشوائية)
        const map = document.getElementById('google-map');
        const locations = [
            "https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d5000!2d31.2!3d30.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1", // موقع 1
            "https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d2000!2d30.0!3d31.2!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1"  // موقع 2
        ];
        
        let count = 0;
        const jump = setInterval(() => {
            map.src = locations[count % locations.length];
            count++;
            if(count > 4) {
                clearInterval(jump);
                finalizeHack();
            }
        }, 1000);
    }

    function finalizeHack() {
        setTimeout(() => {
            document.getElementById('hacker-ui').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('hacker-ui').style.display = "none";
                document.getElementById('phone-overlay').style.display = "flex";
            }, 500);
        }, 1000);
    }

    function unlockPhone() {
        if(document.getElementById('phone-pass').value === "2009") {
            alert("أهلاً بك في نظام هكر النجم. السيطرة كاملة.");
            location.reload();
        } else {
            alert("تم اكتشاف محاولة دخول غير مصرح بها! جاري مسح هويتك!");
        }
    }
</script>
</body>
</html>
