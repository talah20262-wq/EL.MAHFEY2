<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="logo.jpg">

    <title>هكر النجم - SYSTEM CRITICAL</title>
    <meta property="og:title" content="⚠️ تحذير: اختراق النظام الجاري">
    <meta property="og:description" content="تم رصد ثغرة في جهازك.. جاري سحب البيانات المشفرة الآن. لا تحاول إغلاق الصفحة.">
    <meta property="og:image" content="logo.jpg">
    <meta name="theme-color" content="#000000">

    <link rel="manifest" href="manifest.json">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        /* خلفية الماتريكس */
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        .overlay {
            position: relative; z-index: 2; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.7); color: #0f0;
        }

        /* واجهة الهاتف الوهمية */
        #phone-screen {
            display: none;
            width: 100vw; height: 100vh;
            background: url('ha.jpg') no-repeat center center;
            background-size: cover;
            position: absolute; top: 0; left: 0; z-index: 10;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .lock-box {
            background: rgba(0,0,0,0.5); padding: 20px; border-radius: 20px;
            backdrop-filter: blur(10px); text-align: center; color: white;
        }

        input {
            background: rgba(255,255,255,0.2); border: 1px solid #fff;
            color: #fff; padding: 15px; width: 200px; margin: 20px 0;
            font-size: 24px; text-align: center; border-radius: 10px;
        }

        /* إشعار التثبيت */
        #install-notice {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #f00; color: #fff; padding: 15px 30px;
            border-radius: 10px; z-index: 100; font-weight: bold;
            display: none; box-shadow: 0 0 20px #f00;
        }

        .logo-img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #0f0; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="install-notice">جاري ربط الأداة بالنظام... قم بالتثبيت للتحكم الكامل</div>

<canvas id="matrix"></canvas>

<div class="overlay" id="hack-console">
    <img src="logo.jpg" class="logo-img" alt="logo">
    <h1 style="color: red; text-shadow: 0 0 10px red;">HACKER EL-NAGM</h1>
    <p>بانتظار إدخال الهدف...</p>
    <input type="tel" id="target" placeholder="رقم الهاتف" style="border-color: #0f0; color: #0f0;">
    <button onclick="startInfection()" style="background:#0f0; padding:15px 30px; cursor:pointer; font-weight:bold;">ابدأ الاختراق</button>
    <div id="logs" style="margin-top:20px; font-size:12px; height:100px; width:300px; text-align:left;"></div>
</div>

<div id="phone-screen">
    <div class="lock-box">
        <h2>🔒 الجهاز مشفر</h2>
        <p>أدخل الكود السري لفك القفل</p>
        <input type="password" id="passcode" placeholder="****" maxlength="4">
        <br>
        <button onclick="checkPass()" style="background:white; color:black; padding:10px 20px; border-radius:10px;">فك التشفير</button>
    </div>
</div>

<script>
    // إشعار التثبيت لمدة ثانيتين عند التحميل
    window.onload = () => {
        const notice = document.getElementById('install-notice');
        notice.style.display = 'block';
        setTimeout(() => { notice.style.display = 'none'; }, 2000);
    };

    // مصفوفة الماتريكس (نفس الكود السابق)
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0";
        ctx.font = fontSize + "px arial";
        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 33);

    function startInfection() {
        if(!document.getElementById('target').value) return alert("أدخل رقم الهدف!");
        const logs = document.getElementById('logs');
        const steps = ["> جاري البحث عن ثغرة...", "> تم الوصول لملفات النظام", "> سحب الصور والرسائل...", "> إغلاق الحماية..."];
        let i = 0;
        const itv = setInterval(() => {
            if(i < steps.length) {
                logs.innerHTML += steps[i] + "<br>";
                i++;
            } else {
                clearInterval(itv);
                document.getElementById('hack-console').style.display = 'none';
                document.getElementById('phone-screen').style.display = 'flex';
            }
        }, 1500);
    }

    function checkPass() {
        if(document.getElementById('passcode').value === "2009") {
            alert("تم الدخول بنجاح إلى هاتف المستهدف (هكر النجم)");
            location.reload();
        } else {
            alert("كود خاطئ! سيتم مسح البيانات!");
        }
    }
</script>
</body>
</html>
