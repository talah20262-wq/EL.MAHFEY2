<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL - SYSTEM CRITICAL</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        /* خلفية الماتريكس */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* واجهة التحكم */
        .overlay {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
        }

        .terminal-box {
            border: 2px solid #0f0;
            padding: 40px;
            background: rgba(0, 20, 0, 0.9);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .glitch {
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            animation: glitch 1s linear infinite;
        }

        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }

        input {
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 15px;
            width: 80%;
            margin: 20px 0;
            font-size: 1.2rem;
            outline: none;
            text-align: center;
        }

        button {
            background: #0f0;
            color: black;
            border: none;
            padding: 15px 30px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 20px #fff;
        }

        #status-log {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #0f0;
            text-align: left;
            height: 80px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="overlay">
    <div class="terminal-box">
        <div class="glitch">Access Denied</div>
        <p>[ System Vulnerability Detected ]</p>
        
        <input type="tel" id="userNumber" placeholder="أدخل رقم الهاتف للهدف..." maxlength="15">
        <br>
        <button onclick="executeHack()">إطلاق عملية الاختراق</button>

        <div id="status-log"></div>
    </div>
</div>

<audio id="alarmSound" src="https://www.soundjay.com/buttons/beep-01a.mp3"></audio>

<script>
    // إعداد تأثير الماتريكس
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const katakana = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const rainDrops = Array.from({ length: columns }).fill(1);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#0F0';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < rainDrops.length; i++) {
            const text = katakana.charAt(Math.floor(Math.random() * katakana.length));
            ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

            if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                rainDrops[i] = 0;
            }
            rainDrops[i]++;
        }
    }

    setInterval(drawMatrix, 30);

    // وظيفة المحاكاة
    function executeHack() {
        const num = document.getElementById('userNumber').value;
        if(!num) return alert("يجب تحديد الهدف!");

        const audio = document.getElementById('alarmSound');
        audio.play();

        const log = document.getElementById('status-log');
        const steps = [
            "> Initializing brute force on: " + num,
            "> Searching for satellites connection...",
            "> IP Address Found: 192.168.1." + Math.floor(Math.random()*255),
            "> Bypassing 2FA Security...",
            "> Downloading private messages...",
            "> CRITICAL: System is being traced!",
            "> SELF-DESTRUCT IN 3... 2... 1..."
        ];

        let currentStep = 0;
        log.innerHTML = "";

        const interval = setInterval(() => {
            if (currentStep < steps.length) {
                const p = document.createElement('div');
                p.innerText = steps[currentStep];
                log.appendChild(p);
                currentStep++;
            } else {
                clearInterval(interval);
                document.body.style.backgroundColor = "red";
                setTimeout(() => { document.body.style.backgroundColor = "black"; }, 200);
                alert("تمت محاكاة العملية بنجاح! لا تقلق، هذا مجرد كود شكلي.");
            }
        }, 1200);
    }
</script>

</body>
</html>
